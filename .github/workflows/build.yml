name: Build

# Every push is linted and tested, and the recovery is built for every
# device in devices/, each image zipped. A tag starting with v publishes
# those zips as a release, each shown as the phone it is for. Run by hand,
# it can build for one device alone.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      device:
        description: The codename of the one device to build for; every device when empty
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint what runs on the computer
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Render theme preview matrix
        run: |
          cargo run --locked -p skyward-preview -- target/theme-preview --lang zh-CN
          test -s target/theme-preview/02-home-light.png
          test -s target/theme-preview/02-home-light-m3e.png
          test -s target/theme-preview/02-home-light-glass.png
          test -s target/theme-preview/02-home-light-m3e-glass.png
          test -s target/theme-preview/03-home-dark-update-pending.png
          test -s target/theme-preview/03-home-dark-update-pending-m3e.png
          test -s target/theme-preview/03-home-dark-update-pending-glass.png
          test -s target/theme-preview/03-home-dark-update-pending-m3e-glass.png
          test -s target/theme-preview/04-settings-light.png
          test -s target/theme-preview/04-settings-light-m3e.png
          test -s target/theme-preview/04-settings-light-glass.png
          test -s target/theme-preview/04-settings-light-m3e-glass.png
          test -s target/theme-preview/05-settings-dark.png
          test -s target/theme-preview/05-settings-dark-m3e.png
          test -s target/theme-preview/05-settings-dark-glass.png
          test -s target/theme-preview/05-settings-dark-m3e-glass.png
          # Search/decrypt pages exercise the M3E text-field placeholder,
          # keyboard and lock-entry surfaces outside the Home/Settings pair.
          test -s target/theme-preview/01-decrypt-dark.png
          test -s target/theme-preview/01-decrypt-dark-m3e.png
          test -s target/theme-preview/41-search-light.png
          test -s target/theme-preview/41-search-light-m3e.png
          test -s target/theme-preview/42-search-light-found-m3e.png
          test -s target/theme-preview/43-search-dark-pinyin-m3e.png
          # File navigation checks M3E surfaces for path pills, row text,
          # empty/error notes and the complete set of file-type icons.
          test -s target/theme-preview/50-files-light-m3e.png
          test -s target/theme-preview/51-files-dark-m3e.png
          test -s target/theme-preview/110-files-types-light-m3e.png
          test -s target/theme-preview/110-files-types-dark-m3e.png
          test -s target/theme-preview/62-files-empty-light-m3e.png
          test -s target/theme-preview/63-files-unreadable-dark-m3e.png
          # Permissions, mount failures, Wi-Fi and filesystem operations use
          # the same semantic surfaces and must remain readable in M3E.
          test -s target/theme-preview/52-file-permissions-dark-m3e.png
          test -s target/theme-preview/15-mount-light-m3e.png
          test -s target/theme-preview/16-mount-dark-unmount-failed-m3e.png
          test -s target/theme-preview/134-wlan-light-nearby-m3e.png
          test -s target/theme-preview/136-wlan-dark-wrong-password-m3e.png
          test -s target/theme-preview/140-wlan-password-dark-shown-m3e.png
          test -s target/theme-preview/160-filesystems-dark-closed-m3e.png
          test -s target/theme-preview/162-filesystem-dark-cache-m3e.png
          test -s target/theme-preview/176-part-work-light-repair-failed-m3e.png
          # Destructive confirmation tracks must keep their container text
          # legible in both light and dark M3E schemes.
          test -s target/theme-preview/07-wipe-light-m3e.png
          test -s target/theme-preview/91-wipe-light-all-m3e.png
          test -s target/theme-preview/48-restore-backup-dark-deleting-m3e.png
          # The overwrite option is destructive and uses the M3E error role.
          test -s target/theme-preview/80-clash-dark-m3e.png
          # M3E install, backup, restore and update outcome previews.
          test -s target/theme-preview/20-install-storage-checking-m3e.png
          test -s target/theme-preview/20-install-storage-failed-m3e.png
          test -s target/theme-preview/44-backup-light-m3e.png
          test -s target/theme-preview/48-restore-backup-dark-deleting-m3e.png
          test -s target/theme-preview/103-backup-job-light-saved-m3e.png
          test -s target/theme-preview/108-restore-job-light-failed-m3e.png
          test -s target/theme-preview/116-update-dark-failed-m3e.png
          test -s target/theme-preview/194-skyward-update-light-updated-m3e.png
          test -s target/theme-preview/20-install-storage-refused-m3e.png
          test -s target/theme-preview/20-install-script-failed-dark-m3e.png
          test -s target/theme-preview/20-install-storage-installed-reflashed-m3e.png
          test -s target/theme-preview/104-backup-job-light-room-m3e.png
          test -s target/theme-preview/107-restore-job-light-done-m3e.png
          test -s target/theme-preview/109-restore-job-dark-refused-m3e.png
          test -s target/theme-preview/114-update-dark-merging-m3e.png
          test -s target/theme-preview/115-update-light-installed-m3e.png
      - name: Lint what runs on the phone
        run: cargo ndk -t arm64-v8a --platform 30 clippy --locked -p skyward -p skyward-install -p skyward-systems -p skyward-system-init -- -D warnings

  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      # It runs as a second system's first program, before any library is
      # there to load.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
      - name: Gather them
        run: |
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools/
          if-no-files-found: error
          retention-days: 1

  devices:
    name: List the devices
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          if [ -n "$DEVICE" ]; then
            test -f "devices/$DEVICE.toml"
            echo "devices=$(jq -nc --arg device "$DEVICE" '[$device]')" >> "$GITHUB_OUTPUT"
          else
            echo "devices=$(basename -s .toml devices/*.toml | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  recovery:
    name: Recovery for ${{ matrix.device }}
    needs: [tools, devices]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.devices.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tools
          path: tools
      - name: Make the tools runnable
        run: chmod +x tools/skyward tools/skyward-pack
      - name: Read the stock build the recovery is made on
        id: stock
        run: tools/skyward-pack stock --config "devices/${{ matrix.device }}.toml" >> "$GITHUB_OUTPUT"
      - name: Restore the stock recovery
        id: cache
        uses: actions/cache@v6
        with:
          path: stock/recovery.img
          key: stock-recovery-${{ steps.stock.outputs.recovery }}
      # Only what the recovery partition takes is read of the package,
      # which is several gigabytes in all.
      - name: Take the recovery partition out of the stock package
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/skyward-pack stock --config "devices/${{ matrix.device }}.toml" --out stock/recovery.img
      - name: Check the stock recovery
        env:
          RECOVERY: ${{ steps.stock.outputs.recovery }}
        run: echo "$RECOVERY  stock/recovery.img" | sha256sum --check
      - name: Pack the recovery
        id: pack
        env:
          DEVICE: ${{ matrix.device }}
          STOCK: ${{ steps.stock.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          name="skyward-$version-$DEVICE-$STOCK"
          mkdir out
          tools/skyward-pack recovery --stock stock/recovery.img --binary tools/skyward --system-init tools/system-init \
            --config "devices/$DEVICE.toml" --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt --out "out/$name.img"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The image is the whole partition, flashed as it is, and most of it
      # is the room the recovery leaves empty; it is handed out zipped.
      - name: Zip the image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: zip -9 "$NAME.zip" "$NAME.img"
      # The artifact takes the zip's name.
      - uses: actions/upload-artifact@v7
        with:
          path: out/${{ steps.pack.outputs.name }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [check, recovery]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The devices' configurations say which phone each zip is for.
      - uses: actions/checkout@v7
      # Each artifact is a zip, which the download keeps whole under its
      # name, as it is handed out.
      - uses: actions/download-artifact@v8
        with:
          pattern: skyward-*
          path: images
          merge-multiple: true
          skip-decompress: true
      - name: Sum the zips
        working-directory: images
        run: sha256sum -- *.zip > SHA256SUMS
      # Each zip shows on the release as the phone it is for, its model and
      # then its codename, which is how people look for theirs; a device
      # whose zip is missing stops the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          zips=()
          for config in devices/*.toml; do
            device=$(basename "$config" .toml)
            model=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["device"]["model"])' "$config")
            zip=$(ls images/skyward-"$GITHUB_REF_NAME"-"$device"-*.zip)
            zips+=("$zip#$model ($device)")
          done
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "${zips[@]}" images/SHA256SUMS
